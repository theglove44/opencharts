[build]
builder = "nixpacks"

[build.nixpacks]
# Use Node.js 20 for better performance
nodeVersion = "20"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[env]
NODE_ENV = "production"
DATA_MODE = "mock"
PORT = "3001"
HOST = "0.0.0.0"
