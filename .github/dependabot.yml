version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    groups:
      security-patches:
        update-types:
          - security
      dev-dependencies:
        patterns:
          - '*eslint*'
          - '*prettier*'
          - '*typescript*'
          - '*vitest*'
          - '*svelte*'
          - '*vite*'
